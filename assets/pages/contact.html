<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../images/D.svg" type="image/x-icon">

    <script>
      (() => {
        const lang = localStorage.getItem("language") || "pt";
        document.documentElement.lang = lang;
        window.__lang = lang;
        document.write('<style>body{visibility:hidden}</style>');
      })();
    </script>

    <title>Diogo Vieira</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../custom.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body class="bg-custom">

  <header>

    <nav class="nav">
        <a href="../../index.html" class="logo"> <img src="../images/D_logo.svg" alt="Diogo Vieira" width="37rem"></a>
        <button class="hamburger"></button>
        <ul class="nav-list">
          <li><a href="../pages/work.html" data-i18n="nav-work">Trabalhos</a></li>
          <li><a href="../pages/about.html" data-i18n="nav-about">Sobre</a></li>
          <li><a class="active" href="../pages/contact.html" data-i18n="nav-contact">Contato</a></li>

          <li class="d-flex align-items-center me-3 language-toggle">
            <span class="lang-label pt-label me-2">PT</span>
            <label class="custom-switch d-flex align-items-center">
              <input type="checkbox" id="languageSwitcher">
              <span class="slider"></span>
            </label>
            <span class="lang-label en-label ms-2">EN</span>
          </li>
        </ul>
      </nav>

  </header>

  <main class="container my-5 pt-5">
    <div class="row g-4">
  
      <div class="col-md-4 px-2">
        <div class="contact-card px-2">
          <div class="contact-icon pt-1">
            <img src="../images/contact/mail.svg" alt="Ícone de Email">
          </div>
          <p><span data-i18n="contact-email">Mande um email para</span><br>
            <strong>diogovieiragm@gmail.com</strong></p>
        </div>
      </div>
  
      <div class="col-md-4 px-2">
        <div class="contact-card">
          <div class="contact-icon">
            <img src="../images/contact/whatsapp.svg" alt="Ícone de WhatsApp">
          </div>
          <p><span data-i18n="contact-whatsapp">Mande um oi no meu WhatsApp</span><br>
            <strong><a href="https://wa.me/5511940814151" target="_blank">https://wa.me/5511940814151</a></strong></p>
        </div>
      </div>
  
      <div class="col-md-4 px-2">
        <div class="contact-card">
          <div class="contact-icon">
            <img src="../images/contact/linkedin.svg" alt="Ícone de LinkedIn">
          </div>
          <p><span data-i18n="contact-linkedin">Conecte-se comigo no LinkedIn</span><br>
            <strong><a href="https://linkedin.com/in/diogvieira" target="_blank">linkedin.com/in/diogvieira</a></strong></p>
        </div>
      </div>
  
    </div>
  </main>
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../../scripts.js"></script>


    <script>
      const switcher = document.getElementById("languageSwitcher");
  
      async function loadLanguage(lang) {
        try {
          const response = await fetch(`../../locales/${lang}.json`);
          const translations = await response.json();
  
          document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (translations[key]) {
              el.textContent = translations[key];
            }
          });
  
          localStorage.setItem("language", lang);
          if (switcher) switcher.checked = lang === "en";
          updateLangLabels(lang);
        } catch (error) {
          console.error("Erro ao carregar idioma:", error);
        } finally {
          document.body.style.visibility = "visible";
        }
      }
  
      function updateLangLabels(lang) {
        const ptLabel = document.querySelector('.pt-label');
        const enLabel = document.querySelector('.en-label');
        if (ptLabel && enLabel) {
          ptLabel.style.color = lang === 'pt' ? 'white' : '#888';
          enLabel.style.color = lang === 'en' ? 'white' : '#888';
        }
      }
  
      if (switcher) {
        switcher.addEventListener("change", () => {
          const lang = switcher.checked ? "en" : "pt";
          loadLanguage(lang);
        });
  
        
        const savedLang = window.__lang || localStorage.getItem("language") || "pt";
        switcher.checked = savedLang === "en";
        updateLangLabels(savedLang);
        loadLanguage(savedLang);
      } else {
        console.warn("Switcher de idioma não encontrado.");
        document.body.style.visibility = "visible";
      }
    </script>
</body>

</html>
